<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#2b35d1">
<title>UltraVideoDownloader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#2b35d1;--saffron:#f7b500;--bg:#f6f7fb;--card:#fff;--ink:#0e1240;--line:#0e1240;--muted:#5b6080;--ok:#1f9d55;--bad:#c62828;--bar:#e3e6f3;--font:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
:root[data-theme=dark]{--bg:#0b0d24;--card:#151838;--ink:#eef0ff;--line:#5a63e0;--muted:#a3a8d0;--bar:#262a55;--ok:#3ecf7e;--bad:#ff7b7b;color-scheme:dark}
:root[lang=ar]{--font:"Noto Sans Arabic","Inter",ui-sans-serif,system-ui,"Segoe UI",sans-serif}
:root[lang=ar] *{letter-spacing:0!important}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:var(--font);background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
button,select,input{font:inherit;color:inherit}
.top{background:var(--blue);color:#f6f7fb}
.top .in{width:min(820px,calc(100% - 32px));margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.02em}
.brand img{width:30px;height:30px}
.tools{display:flex;gap:8px;align-items:center}
.tools button,.tools select{font-size:14px;font-weight:600;color:#f6f7fb;background:transparent;border:2px solid #f6f7fb;padding:5px 10px;cursor:pointer;border-radius:0}
.tools select option{color:#0e1240}
.tools button:hover{background:#f6f7fb;color:var(--blue)}
main{width:min(820px,calc(100% - 32px));margin:0 auto;padding:26px 0 40px}
.banner{display:none;margin:0 0 18px;padding:12px 14px;border:3px solid var(--line);background:var(--saffron);color:#0e1240;font-weight:600;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner.show{display:flex}
.banner.lost{background:var(--bad);color:#fff}
.banner button{font-weight:800;background:#0e1240;color:#fff;border:0;padding:8px 16px;cursor:pointer}
h1{margin:0 0 18px;font-weight:800;font-size:clamp(30px,5.5vw,46px);line-height:1.05;letter-spacing:-.03em}
.label{display:block;font-weight:700;font-size:14px;margin:0 0 6px}
.urlrow{display:flex}
.urlrow input{min-width:0;flex:1;font-size:17px;padding:14px;background:var(--card);border:3px solid var(--line);border-inline-end:0;border-radius:0}
.btn{font-weight:800;font-size:17px;color:#0e1240;background:var(--saffron);border:3px solid var(--line);border-radius:0;padding:0 24px;cursor:pointer}
.btn:hover{background:#ffc82e}
.btn:disabled{opacity:.55;cursor:not-allowed}
.msg{display:none;margin-top:12px;padding:10px 14px;border:3px solid var(--line);background:var(--card);font-weight:500}
.msg.show{display:block}
.msg.bad{border-color:var(--bad)}
.preview{display:none;margin-top:18px;border:3px solid var(--line);background:var(--card)}
.preview.show{display:block}
.pv-head{display:flex;gap:14px;padding:14px}
.pv-head img,.thumb{width:168px;aspect-ratio:16/9;object-fit:cover;background:var(--bar);flex:none;display:block}
.pv-title{font-weight:800;font-size:18px;line-height:1.25;overflow-wrap:anywhere}
.meta{font-size:14px;color:var(--muted);margin-top:4px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 14px 14px}
select{width:100%;padding:11px 10px;background:var(--card);border:3px solid var(--line);border-radius:0}
.saveto{display:flex;gap:10px;align-items:center;padding:0 14px 14px}
.saveto .path{flex:1;min-width:0;font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;text-align:start}
.small{font-weight:700;font-size:14px;background:var(--card);border:3px solid var(--line);padding:8px 14px;cursor:pointer;border-radius:0}
.small:hover{background:var(--bar)}
.go{display:block;width:calc(100% - 28px);margin:0 14px 14px;padding:14px;font-size:18px}
h2{font-size:20px;font-weight:800;margin:30px 0 12px}
.empty{color:var(--muted);font-size:15px;margin:0}
.job{display:flex;gap:14px;padding:12px;margin-bottom:12px;border:3px solid var(--line);background:var(--card)}
.job .thumb{width:128px}
.job .body{flex:1;min-width:0}
.job .ttl{font-weight:700;overflow-wrap:anywhere;line-height:1.3}
.bar{height:12px;margin:10px 0 6px;background:var(--bar)}
.bar>i{display:block;height:100%;width:0;background:var(--blue);transition:width .5s}
:root[data-theme=dark] .bar>i{background:var(--saffron)}
.job.done .bar>i{background:var(--ok)}
.job.error .bar>i{background:var(--bad)}
.job.waiting .bar>i,.job.paused .bar>i{background:var(--muted)}
.st{font-size:14px;font-weight:600;unicode-bidi:plaintext}
.job.error .st{color:var(--bad)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.acts .small{padding:5px 12px;font-size:13px}
.adslot{height:0;overflow:hidden;text-align:center}
.adslot.on{height:auto;padding-top:26px}
.adslot .adlabel{display:block;margin:0 0 8px;font-size:12px;color:var(--muted)}
.adslot iframe{display:block;width:100%;max-width:728px;height:300px;border:0;margin:0 auto;color-scheme:normal}
.foot{margin:30px 0 0;font-size:13px;color:var(--muted);max-width:46em}
dialog{border:3px solid var(--line);background:var(--card);color:var(--ink);padding:22px;width:min(440px,calc(100% - 32px))}
dialog::backdrop{background:rgba(5,6,30,.6)}
dialog h3{margin:0 0 14px;font-size:20px}
dialog label.row{display:flex;gap:10px;align-items:flex-start;margin:0 0 14px;font-weight:500}
dialog label.row input{margin-top:5px;width:18px;height:18px;flex:none}
dialog .links{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
@media(max-width:560px){.urlrow{flex-direction:column}.urlrow input{border-inline-end:3px solid var(--line);border-bottom:0}.btn{padding:14px}.pv-head{flex-direction:column}.pv-head img{width:100%}.opts{grid-template-columns:1fr}.job .thumb{width:90px}.brand span{display:none}}
@media(prefers-reduced-motion:reduce){.bar>i{transition:none}}
</style>
</head>

  <div class="opts">
   <div><label class="label" for="quality" data-i="quality"></label><select id="quality"></select></div>

  </div>
  <div class="saveto"><button class="small" id="saveTo" type="button" data-i="saveto"></button><span class="path" id="pathText"></span></div>
  <button class="btn go" id="go" type="button" data-i="download"></button>
 </section>

 <h2 data-i="downloads"></h2>
 <div id="jobs"></div>
 <p class="empty" id="none" data-i="none"></p>

 <div class="adslot" data-slot="app"><span class="adlabel" data-i="ad"></span><iframe title="Advertisement" scrolling="no" referrerpolicy="no-referrer-when-downgrade" sandbox="allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe></div>
 <p class="foot" data-i="foot"></p>
</main>

<dialog id="dlg">
 <h3 data-i="settings"></h3>
 <label class="row"><input type="checkbox" id="stats"><span data-i="stats"></span></label>
 <div class="meta" id="ver"></div>
 <div class="links">
  <button class="small" id="priv" type="button" data-i="privacy"></button>
  <button class="small" id="quit" type="button" data-i="quit"></button>
  <button class="small" id="close" type="button" data-i="close"></button>
 </div>
</dialog>

function pickLang(){const l=S.language||(navigator.language||'en').slice(0,2).toLowerCase();return T[l]?l:'en'}

const fmtBytes=n=>{if(!n)return'';const u=['B','KB','MB','GB','TB'];let i=0;while(n>=1024&&i<4){n/=1024;i++}return n.toFixed(i>1?1:0)+' '+u[i]};

const errText=c=>t('e_'+c)===('e_'+c)?t('e_failed'):t('e_'+c);

let timer=null;
function validUrl(v){try{const u=new URL(v);return u.protocol==='http:'||u.protocol==='https:'}catch{return false}}
async function checkLink(){
 const v=$('url').value.trim();say('');
 if(!v){$('preview').classList.remove('show');info=null;return}
 if(!validUrl(v)){say(t('bad_url'),true);return}
 if(v===infoUrl&&info)return;
 say(t('checking'));$('check').disabled=true;
 try{
  const r=await post('/api/info',{url:v});const j=await r.json();

  if(!r.ok){info=null;$('preview').classList.remove('show');say(errText(j.error),true);return}

function showPreview(){
 $('pvImg').src=info.thumbnail||'';$('pvImg').style.visibility=info.thumbnail?'visible':'hidden';

 fillQualities();$('pathText').textContent=S.download_dir;$('preview').classList.add('show');
}
function fillQualities(){
 const q=$('quality'),qs=info.qualities||[];q.innerHTML='';
 const add=(v,txt)=>{const o=document.createElement('option');o.value=v;o.textContent=txt;q.appendChild(o)};
 const label=x=>{const tag=qTag(x.height);return x.height+'p'+(tag?' '+tag:'')+(x.size?' · ~'+fmtBytes(x.size):'')};
 if(!qs.length)add('best',t('best'));
 else qs.forEach((x,i)=>add(i===0?'best':String(x.height),(i===0?t('best')+' · ':'')+label(x)));
 q.disabled=$('format').value==='mp3';
}
$('format').addEventListener('change',()=>{$('quality').disabled=$('format').value==='mp3'});
$('url').addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(checkLink,700)});
$('url').addEventListener('paste',()=>{clearTimeout(timer);timer=setTimeout(checkLink,150)});
$('url').addEventListener('keydown',e=>{if(e.key==='Enter'){clearTimeout(timer);checkLink()}});
$('check').addEventListener('click',()=>{infoUrl='';checkLink()});

// ---- start download
$('go').addEventListener('click',async()=>{
 if(!info)return;$('go').disabled=true;
 const opt=$('quality').selectedOptions[0],h=info.qualities&&info.qualities.find(x=>String(x.height)===$('quality').value);
 const best=info.qualities&&info.qualities[0];
 const size=($('format').value==='mp4'?(h||best||{}).size:null)||null;
 try{
  const r=await post('/api/jobs',{url:infoUrl,format:$('format').value,quality:$('quality').value,title:info.title,thumbnail:info.thumbnail,duration:info.duration,site:info.site,size_estimate:size});
  const j=await r.json();
  if(!r.ok){say(errText(j.error),true);return}
  $('url').value='';info=null;infoUrl='';$('preview').classList.remove('show');say('');loadJobs();
 }catch{say(t('lost'),true)}finally{$('go').disabled=false}
});

// ---- save to
async function chooseFolder(){
 try{
  const r=await post('/api/choose-folder');const j=await r.json();
  let path=null;
  if(r.status===501){path=prompt(t('folder_prompt'),S.download_dir);if(!path)return}
  else if(j.cancelled)return;else if(j.path)path=j.path;
  if(!path)return;
  const r2=await post('/api/settings',{download_dir:path});
  if(!r2.ok){say(t('folder_bad'),true);return}
  S=Object.assign(S,await r2.json());$('pathText').textContent=S.download_dir;
 }catch{say(t('lost'),true)}
}
$('saveTo').addEventListener('click',chooseFolder);

// ---- jobs list
let lastJobs=[],cards={};
function renderJobs(list,force){
 lastJobs=list;const box=$('jobs');$('none').style.display=list.length?'none':'';
 if(force){box.innerHTML='';cards={}}
 const ids=new Set(list.map(j=>j.id));
 for(const id of Object.keys(cards))if(!ids.has(id)){cards[id].el.remove();delete cards[id]}
 list.forEach((j,idx)=>{
  let c=cards[j.id];
  if(!c){
   const el=document.createElement('div');el.className='job';
   el.innerHTML='<img class="thumb" alt=""><div class="body"><div class="ttl"></div><div class="meta"></div><div class="bar"><i></i></div><div class="st"></div><div class="acts"></div></div>';
   c=cards[j.id]={el,sig:'',img:el.querySelector('img'),ttl:el.querySelector('.ttl'),meta:el.querySelector('.meta'),fill:el.querySelector('i'),st:el.querySelector('.st'),acts:el.querySelector('.acts')};
   if(j.thumbnail)c.img.src=j.thumbnail;else c.img.style.display='none';
   c.ttl.textContent=j.title||j.url;
  }
  if(box.children[idx]!==c.el)box.insertBefore(c.el,box.children[idx]||null);
  c.el.className='job '+j.status;
  c.meta.textContent=[j.site,fmtDur(j.duration),j.format==='mp3'?'MP3':(j.quality==='best'?'':j.quality+'p')].filter(Boolean).join(' · ');
  c.fill.style.width=(j.status==='done'?100:j.percent||0)+'%';
  let s=t('s_'+j.status);
  if(j.status==='downloading')s+=' '+(j.percent||0).toFixed(1)+'%'+(j.speed?' · '+fmtBytes(j.speed)+'/s':'')+(j.eta!=null?' · '+fmtEta(j.eta):'');
  else if(j.status==='paused'||j.status==='waiting')s+=' · '+(j.percent||0).toFixed(1)+'%';
  else if(j.status==='done')s+=' · '+fmtBytes(j.size);
  else if(j.status==='error')s+=': '+errText(j.error);
  c.st.textContent=s;
  const sig=j.status+'|'+lang;
  if(sig!==c.sig){c.sig=sig;c.acts.innerHTML='';
   const btn=(k,fn)=>{const b=document.createElement('button');b.className='small';b.type='button';b.textContent=t(k);b.onclick=async()=>{b.disabled=true;await fn();loadJobs()};c.acts.appendChild(b)};
   const act=a=>()=>post('/api/jobs/'+j.id+'/'+a);
   if(['queued','downloading','waiting'].includes(j.status))btn('pause',act('pause'));
   if(j.status==='paused')btn('resume',act('resume'));
   if(j.status==='error')btn('retry',act('resume'));
   if(j.status==='done')btn('show',act('reveal'));
   if(['queued','downloading','processing','waiting','paused'].includes(j.status))btn('cancel',act('cancel'));
   if(['done','error'].includes(j.status))btn('remove',act('remove'));
  }
 });
}
let up=true;
async function loadJobs(){
 try{const l=await jget('/api/jobs');setUp(true);renderJobs(l)}catch{setUp(false)}
}
function setUp(ok){
 if(ok===up)return;up=ok;
 if(!ok){showBanner(t('lost'),null,true)}else hideBanner();
}
(async function loop(){
 await loadJobs();
 const active=lastJobs.some(j=>['queued','downloading','processing','waiting'].includes(j.status));
 setTimeout(loop,active?1000:3000);
})();

// ---- banner / updates
let bannerKind='';
function showBanner(text,btn,lost){const b=$('banner');b.className='banner show'+(lost?' lost':'');$('bannerText').textContent=text;const bb=$('bannerBtn');bb.style.display=btn?'':'none';if(btn){bb.textContent=btn.text;bb.onclick=btn.fn}}
function hideBanner(){if(bannerKind!=='update')$('banner').className='banner'}
async function checkUpdate(){
 try{
  const v=await jget('/api/version');
  if(v.update&&v.update.state==='error'){bannerKind='update';showBanner(t('update_fail'),{text:t('update_btn'),fn:startUpdate});return}
  if(v.update&&v.update.state==='downloading'){bannerKind='update';showBanner(t('update_down')+' '+(v.update.percent||0)+'%');setTimeout(checkUpdate,1000);return}
  if(v.update&&v.update.state==='installing'){bannerKind='update';showBanner(t('update_inst'));setTimeout(checkUpdate,1500);return}
  if(v.update_available){bannerKind='update';showBanner(t('update_new')+'v'+v.latest,{text:t('update_btn'),fn:startUpdate})}
 }catch{}
}
async function startUpdate(){try{await post('/api/update');}catch{}setTimeout(checkUpdate,500)}
setInterval(checkUpdate,3600000);

// ---- settings dialog
$('setBtn').addEventListener('click',()=>{$('stats').checked=!!S.stats;$('dlg').showModal()});
$('close').addEventListener('click',()=>$('dlg').close());
$('stats').addEventListener('change',async()=>{S.stats=$('stats').checked;await post('/api/settings',{stats:S.stats})});
$('priv').addEventListener('click',()=>post('/api/open-url',{url:SITE+'/privacy.html'}));
$('quit').addEventListener('click',async()=>{try{await post('/api/quit')}catch{}document.body.innerHTML='<p style="text-align:center;margin-top:30vh;font-family:sans-serif;color:#98a5bd">'+t('closed')+'</p>'});
$('lang').addEventListener('change',async()=>{S.language=$('lang').value;applyLang();try{await post('/api/settings',{language:S.language})}catch{}});
$('themeBtn').addEventListener('click',async()=>{const o=['system','light','dark'];S.theme=o[(o.indexOf(S.theme)+1)%3];applyTheme();try{await post('/api/settings',{theme:S.theme})}catch{}});

(async function init(){
 try{S=Object.assign(S,await jget('/api/settings'))}catch{}
 applyLang();checkUpdate();
})();
</script>
<script>
// Ad slot: the ad lives in a frame hosted on our website (a different origin from this app), so ad code cannot touch the app.
(function(){
  var file=innerWidth>=760?'banner.html':'banner-small.html';
  var slots=[].slice.call(document.querySelectorAll('.adslot'));
  slots.forEach(function(s){s.querySelector('iframe').src=SITE+'/ads/'+file+'?s='+s.getAttribute('data-slot');});
  addEventListener('message',function(e){
    if(e.origin!==SITE||!e.data||!e.data.uvdAd)return;
    slots.forEach(function(s){
      var f=s.querySelector('iframe');if(f.contentWindow!==e.source)return;
      var hh=Math.max(0,Math.min(300,+e.data.height||0));
      if(hh>=20){f.style.height=hh+'px';s.classList.add('on');}else{s.classList.remove('on');}
    });
  });
})();
</script>
